<!DOCTYPE html>
<html>
<head>
  <title>Extension Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
      display: block;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #357abd;
    }
    .icon-preview {
      display: inline-block;
      margin: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Bookmark Tab Group Manager - Icon Generator</h1>
  <p>Click the button below to generate and download all required icon files.</p>
  
  <button onclick="generateAllIcons()">Generate All Icons</button>
  
  <div id="previews"></div>
  
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Draw background with gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4a90e2');
      gradient.addColorStop(1, '#357abd');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw rounded corners effect
      ctx.globalCompositeOperation = 'destination-in';
      ctx.beginPath();
      const radius = size * 0.15;
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      
      // Draw bookmark icon
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1, size / 32);
      
      const centerX = size / 2;
      const centerY = size / 2;
      const bookmarkWidth = size * 0.4;
      const bookmarkHeight = size * 0.5;
      
      // Draw bookmark shape
      ctx.beginPath();
      ctx.moveTo(centerX - bookmarkWidth / 2, centerY - bookmarkHeight / 2);
      ctx.lineTo(centerX, centerY - bookmarkHeight / 2 + bookmarkHeight * 0.2);
      ctx.lineTo(centerX + bookmarkWidth / 2, centerY - bookmarkHeight / 2);
      ctx.lineTo(centerX + bookmarkWidth / 2, centerY + bookmarkHeight / 2);
      ctx.lineTo(centerX - bookmarkWidth / 2, centerY + bookmarkHeight / 2);
      ctx.closePath();
      ctx.fill();
      
      // Draw tab group indicator (small squares)
      if (size >= 48) {
        ctx.fillStyle = '#4a90e2';
        const squareSize = size * 0.12;
        const spacing = size * 0.08;
        const startX = centerX - (squareSize + spacing);
        const startY = centerY + bookmarkHeight / 2 + spacing;
        
        // Draw 3 small squares representing tabs
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(startX + i * (squareSize + spacing), startY, squareSize, squareSize);
        }
      }
    }
    
    // Polyfill for roundRect if not available
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
        this.beginPath();
        this.moveTo(x + radius, y);
        this.lineTo(x + width - radius, y);
        this.quadraticCurveTo(x + width, y, x + width, y + radius);
        this.lineTo(x + width, y + height - radius);
        this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        this.lineTo(x + radius, y + height);
        this.quadraticCurveTo(x, y + height, x, y + height - radius);
        this.lineTo(x, y + radius);
        this.quadraticCurveTo(x, y, x + radius, y);
        this.closePath();
      };
    }
    
    function downloadIcon(canvas, filename) {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }
    
    function generateIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      drawIcon(canvas, size);
      return canvas;
    }
    
    function generateAllIcons() {
      const sizes = [16, 48, 128];
      const previewsDiv = document.getElementById('previews');
      previewsDiv.innerHTML = '<h2>Generated Icons:</h2>';
      
      sizes.forEach((size, index) => {
        setTimeout(() => {
          const canvas = generateIcon(size);
          const filename = `icon${size}.png`;
          
          // Create preview
          const preview = document.createElement('div');
          preview.className = 'icon-preview';
          preview.innerHTML = `
            <canvas width="${size}" height="${size}"></canvas>
            <p>${filename} (${size}x${size})</p>
          `;
          const previewCanvas = preview.querySelector('canvas');
          previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
          previewsDiv.appendChild(preview);
          
          // Download
          downloadIcon(canvas, filename);
        }, index * 500);
      });
      
      setTimeout(() => {
        alert('All icons have been generated and downloaded! Place them in the icons/ folder.');
      }, sizes.length * 500 + 500);
    }
    
    // Generate previews on load
    window.onload = () => {
      const sizes = [16, 48, 128];
      sizes.forEach(size => {
        const canvas = generateIcon(size);
        const preview = document.createElement('div');
        preview.className = 'icon-preview';
        preview.innerHTML = `
          <canvas width="${size}" height="${size}"></canvas>
          <p>icon${size}.png (${size}x${size})</p>
        `;
        const previewCanvas = preview.querySelector('canvas');
        previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
        document.getElementById('previews').appendChild(preview);
      });
    };
  </script>
</body>
</html>
