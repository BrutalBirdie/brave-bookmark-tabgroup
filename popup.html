<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Tab Group Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Bookmark Tab Group Manager</h1>
    
    <div class="section">
      <h2>Select Bookmark or Folder</h2>
      <div class="bookmark-selector">
        <select id="bookmarkSelect" class="bookmark-select">
          <option value="">-- Select a bookmark or folder --</option>
        </select>
        <button id="refreshBtn" class="btn btn-secondary" title="Refresh bookmark list">↻</button>
      </div>
    </div>
    
    <div class="section" id="assignmentSection" style="display: none;">
      <h2>Tab Group Assignment</h2>
      <div class="tabgroup-selector">
        <select id="tabGroupSelect" class="tabgroup-select">
          <option value="">-- No tab group (default) --</option>
          <option value="__create_new__">+ Create New Tab Group</option>
        </select>
        <button id="refreshGroupsBtn" class="btn btn-secondary" title="Refresh tab groups">↻</button>
      </div>
      
      <div id="createGroupSection" class="create-group-section" style="display: none;">
        <div class="form-group">
          <label for="newGroupName">Tab Group Name:</label>
          <input type="text" id="newGroupName" class="form-input" placeholder="Enter tab group name" maxlength="50">
        </div>
        <div class="form-group">
          <span class="color-picker-label">Color:</span>
          <div id="newGroupColorPicker" class="color-picker" role="group" aria-label="Tab group color">
            <input type="radio" name="newGroupColor" id="color-grey" value="grey" checked>
            <label for="color-grey" class="color-chip" data-color="grey" title="Grey"></label>
            <input type="radio" name="newGroupColor" id="color-blue" value="blue">
            <label for="color-blue" class="color-chip" data-color="blue" title="Blue"></label>
            <input type="radio" name="newGroupColor" id="color-red" value="red">
            <label for="color-red" class="color-chip" data-color="red" title="Red"></label>
            <input type="radio" name="newGroupColor" id="color-yellow" value="yellow">
            <label for="color-yellow" class="color-chip" data-color="yellow" title="Yellow"></label>
            <input type="radio" name="newGroupColor" id="color-green" value="green">
            <label for="color-green" class="color-chip" data-color="green" title="Green"></label>
            <input type="radio" name="newGroupColor" id="color-pink" value="pink">
            <label for="color-pink" class="color-chip" data-color="pink" title="Pink"></label>
            <input type="radio" name="newGroupColor" id="color-purple" value="purple">
            <label for="color-purple" class="color-chip" data-color="purple" title="Purple"></label>
            <input type="radio" name="newGroupColor" id="color-cyan" value="cyan">
            <label for="color-cyan" class="color-chip" data-color="cyan" title="Cyan"></label>
            <input type="radio" name="newGroupColor" id="color-orange" value="orange">
            <label for="color-orange" class="color-chip" data-color="orange" title="Orange"></label>
          </div>
        </div>
      </div>
      
      <div class="actions">
        <button id="saveBtn" class="btn btn-primary">Save Assignment</button>
        <button id="clearBtn" class="btn btn-secondary">Clear Assignment</button>
      </div>
      <div id="statusMessage" class="status-message"></div>
    </div>
    
    <div class="section">
      <h2>Quick Actions</h2>
      <div class="quick-actions">
        <button id="openBookmarkBtn" class="btn btn-action" disabled>Open Selected Bookmark</button>
        <button id="openFolderBtn" class="btn btn-action" disabled>Open Selected Folder</button>
      </div>
    </div>
    
    <div class="section">
      <h2>Info</h2>
      <p class="info-text">
        Select a bookmark or folder above, then choose a tab group to assign it to.
        When you open the bookmark, it will automatically open in the assigned tab group.
      </p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
